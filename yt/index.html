<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keys — Play any song on piano.</title>
    <meta name="description"
        content="Turn any piano video into falling notes you can play along with. Free on iPhone and Android.">

    <!-- Deliberately noindex: this page exists so YouTube traffic lands somewhere
         with campaign-tagged store links. It must not compete with /keys/ in
         search, and its traffic count is only meaningful if every visitor
         actually came from a video. -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#080B13">

    <link rel="icon" href="/keys/KeysIcon-48.png" sizes="48x48">
    <link rel="apple-touch-icon" href="/keys/KeysIcon-128.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Same stylesheet as the main Keys page, so this reads as one product. -->
    <link rel="stylesheet" href="/keys/style.css?v=5">

    <style>
        /* Single-purpose page: one screen, one decision, no scrolling required. */
        .yt-wrap {
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px 22px 44px;
            gap: 22px;
        }

        .yt-icon {
            width: 84px;
            height: 84px;
            border-radius: 20px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .55), 0 0 0 1px var(--border);
        }

        .yt-head {
            margin-top: 0;
            font-size: clamp(2rem, 8vw, 3rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.05;
        }

        .yt-sub {
            color: var(--text-soft);
            font-size: clamp(1rem, 4.2vw, 1.15rem);
            line-height: 1.5;
            max-width: 30ch;
        }

        .yt-stores {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
            margin-top: 4px;
        }

        .yt-stores img { display: block; }

        .yt-note {
            color: var(--text-mute);
            font-size: 0.86rem;
        }

        .yt-back {
            color: var(--text-faint);
            font-size: 0.82rem;
            text-decoration: none;
            border-bottom: 1px solid transparent;
        }

        .yt-back:hover { color: var(--text-soft); border-bottom-color: var(--border-hi); }
    </style>
</head>

<body>
    <main class="yt-wrap">
        <img class="yt-icon" src="/keys/KeysIcon-128.png" alt="Keys app icon" width="84" height="84">

        <h1 class="headline yt-head">Play any song<br><span class="grad">on piano.</span></h1>

        <p class="yt-sub">
            Share any piano video to Keys and it turns into falling notes you can play along with.
        </p>

        <div class="yt-stores">
            <!-- Campaign-tagged. iOS uses Apple's App Analytics campaign link
                 (pt = provider token, ct = campaign); Android uses the Play
                 Install Referrer. Both so installs from the channel are
                 attributable instead of counting as organic. -->
            <a href="https://apps.apple.com/app/apple-store/id6769897403?pt=128300490&amp;ct=youtubeshorts&amp;mt=8"
               target="_blank" rel="noopener noreferrer"
               aria-label="Download Keys on the App Store">
                <img src="/keys/badge-app-store.svg" alt="Download on the App Store" width="162" height="54">
            </a>
            <a href="https://play.google.com/store/apps/details?id=com.bestdaylabs.keys&amp;referrer=utm_source%3Dyoutube%26utm_medium%3Dshorts%26utm_campaign%3Dkeys_hooks"
               target="_blank" rel="noopener noreferrer"
               aria-label="Get Keys on Google Play">
                <img src="/keys/badge-google-play.png" alt="Get it on Google Play" width="202" height="78">
            </a>
        </div>

        <p class="yt-note">Free to try. Cancel anytime.</p>

        <a class="yt-back" href="/keys/">See everything Keys does &rarr;</a>
    </main>
    <script>
        // Page-hit logging. Every visitor here typed bestdaylabs.com/yt off the
        // screen of a Short — Shorts descriptions aren't tappable — so this count
        // is a direct measure of whether the on-screen CTA works.
        //
        // Insert-only against Supabase with the app's publishable key; RLS lets
        // anon write and never read, so nothing is exposed by shipping the key.
        (function () {
            try {
                // Skip crawlers and link-safety scanners. Putting the URL in a
                // YouTube description triggers a fan-out of Google checkers
                // (Google-Safety, plus generic desktop agents) within seconds of
                // publishing — five such hits arrived before any human did, and
                // an uncounted bot is better than a counter nobody can trust.
                var ua = navigator.userAgent || "";
                if (/bot|crawl|spider|slurp|headless|preview|scanner|Google-Safety|bot\.html/i.test(ua)) return;
                if (navigator.webdriver) return;
                // Prerender/prefetch: only count a page a human actually saw.
                if (document.visibilityState !== "visible") return;
                var url = "https://bwvxwlcpxeshagtfehrd.supabase.co/rest/v1/yt_page_hits";
                var key = "sb_publishable_1mtSE1OjnTK8iVOq1WAqmg_KcxQxwc6";
                fetch(url, {
                    method: "POST",
                    headers: {
                        "apikey": key,
                        "Authorization": "Bearer " + key,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify({
                        referrer: document.referrer || null,
                        user_agent: navigator.userAgent,
                        path: location.pathname + location.search
                    })
                    // No keepalive: it isn't needed (the page doesn't navigate
                    // away on load) and the request failed with 503 under it.
                }).catch(function () { /* analytics must never break the page */ });
            } catch (e) { /* ditto */ }
        })();
    </script>
</body>

</html>
