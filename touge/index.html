<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touge - Track your drive. Own the road.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0A0A0A;
            --text-color: #f4f4f5;
            --accent-color: #E63946;
            --muted-color: #a1a1aa;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .logo {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 0.75rem;
            margin: 0 0 0.5rem 0;
            text-transform: uppercase;
        }
        .tagline {
            font-size: 1.25rem;
            color: var(--muted-color);
            margin-bottom: 3rem;
            font-weight: 400;
        }
        .screenshot-container {
            margin-bottom: 3rem;
        }
        .screenshot-container img {
            max-width: 320px;
            width: 100%;
            height: auto;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(230, 57, 70, 0.15);
        }
        .download-btn {
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 1rem 2.5rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }
        .download-btn:hover {
            background-color: #c92a37;
            transform: translateY(-2px);
        }
        footer {
            padding: 2rem;
            text-align: center;
            font-size: 0.85rem;
        }
        footer a {
            color: var(--muted-color);
            text-decoration: none;
            margin: 0 15px;
            transition: color 0.2s ease;
        }
        footer a:hover {
            color: var(--accent-color);
        }
        .copyright {
            color: #52525b;
            margin-top: 1rem;
            display: block;
        }
    </style>
</head>
<body>

    <main class="main-content">
        <h1 class="logo">TOUGE</h1>
        <p class="tagline">Track your drive. Own the road.</p>
        
        <div class="screenshot-container">
            <img src="TougeAppMockup.png" alt="Touge App HUD Mockup">
        </div>

        <a href="https://apps.apple.com/us/app/touge-drive-tracker/id6760924539" class="download-btn">Download on the App Store</a>
    </main>

    <footer>
        <a href="terms.html">Terms of Service</a>
        <a href="privacy.html">Privacy Policy</a>
        <span class="copyright">&copy; 2025 Touge. All rights reserved.</span>
    </footer>

</body>
</html>
